<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1f2a">
<title>Chess</title>
<style>:root{
  --bg1:#1b1f2a; --bg2:#0f1218; --panel:#232838; --panel2:#2b3144; --text:#e8eaf0; --muted:#9aa3b8;
  --accent:#e0b35a; --light:#f0dab5; --dark:#b3845f; --sel:rgba(255,215,0,.45); --last:rgba(255,230,90,.42);
  --sz:min(92vw, calc(100vh - 175px), 620px);
}
@supports (height:100dvh){:root{--sz:min(92vw, calc(100dvh - 175px), 620px)}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:radial-gradient(1200px 800px at 20% 0%, #2a3042 0%, var(--bg1) 45%, var(--bg2) 100%);
  color:var(--text); font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif; min-height:100vh;
  -webkit-text-size-adjust:100%; -webkit-tap-highlight-color:transparent}
.hidden{display:none !important}
.app{max-width:1060px;margin:0 auto;padding:14px 12px 24px}
header{display:flex;align-items:center;gap:10px;margin:0 0 10px}
header h1{font-size:22px;margin:0;letter-spacing:.5px;font-weight:700}
header h1 span{color:var(--accent)}
header .sub{color:var(--muted);font-size:13px}
main{display:flex;gap:18px;align-items:flex-start;justify-content:center;flex-wrap:wrap}
.board-col{display:flex;flex-direction:column;gap:4px;width:var(--sz);min-width:0}
.pbar{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:30px;padding:0 2px;border-radius:8px}
.pbar.active{background:rgba(224,179,90,.10)}
.captured{display:flex;align-items:center;min-width:0;overflow:hidden;white-space:nowrap;color:var(--muted)}
.captured .adv{font:600 13px system-ui,sans-serif;margin-left:6px;color:var(--accent)}
.captured .lbl{font:600 12px system-ui,sans-serif;color:var(--muted);margin-right:8px;min-width:54px}
.captured svg.pc.mini{width:20px;height:20px;margin-right:-6px;flex:none}
.captured svg.pc.mini:last-of-type{margin-right:0}
.clk{font:700 17px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;padding:6px 9px;border-radius:7px;background:#1a1e2a;color:var(--muted);min-width:64px;text-align:center;flex:none}
.clk.on{color:#fff;background:#3a4259} .clk.low{color:#fff;background:#a23232}
.frame{position:relative;padding:calc(var(--sz)/80);border-radius:10px;background:linear-gradient(145deg,#5a3d28,#3a2718);
  box-shadow:0 18px 50px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.12)}
.board{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);width:100%;aspect-ratio:1;
  border-radius:4px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.sq{position:relative;display:flex;align-items:center;justify-content:center;cursor:default;min-width:0;min-height:0}
.sq.light{background:var(--light)} .sq.dark{background:var(--dark)}
.sq.last::before{content:"";position:absolute;inset:0;background:var(--last)}
.sq.sel::before{content:"";position:absolute;inset:0;background:var(--sel)}
.sq.check::before{content:"";position:absolute;inset:0;background:radial-gradient(circle, rgba(255,40,40,.95) 0%, rgba(230,0,0,.55) 45%, rgba(200,0,0,0) 75%)}
.sq.hintsq::after{content:"";position:absolute;inset:3%;border:calc(var(--sz)/90) solid #2fb36b;border-radius:18%;pointer-events:none;z-index:4;box-shadow:0 0 8px rgba(47,179,107,.8)}
.sq.movable{cursor:grab}
.sq.target{cursor:pointer}
.sq.dot::after{content:"";position:absolute;width:30%;height:30%;border-radius:50%;background:rgba(20,30,20,.32);pointer-events:none;z-index:3}
.sq.ring::after{content:"";position:absolute;inset:4%;border-radius:50%;border:calc(var(--sz)/110) solid rgba(20,30,20,.35);pointer-events:none;z-index:3}
.sq.hover{box-shadow:inset 0 0 0 calc(var(--sz)/150) rgba(255,255,255,.75)}
svg.pc,.ghost svg{display:block;position:relative;z-index:2;width:calc(var(--sz)/8*.9);height:calc(var(--sz)/8*.9);pointer-events:none;
  shape-rendering:crispEdges;filter:drop-shadow(0 1px 1px rgba(0,0,0,.35))}
svg.pc.lift{opacity:.25}
.ghost{position:fixed;z-index:50;transform:translate(-50%,-55%) scale(1.15);filter:drop-shadow(0 8px 8px rgba(0,0,0,.45));pointer-events:none}
.cap-ghost{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:1;pointer-events:none}
.cap-ghost svg.pc{z-index:1}
.coord{position:absolute;font:700 calc(var(--sz)/52) system-ui,sans-serif;z-index:1;pointer-events:none;opacity:.85}
.coord.rank{top:3%;left:4%} .coord.file{bottom:2%;right:5%}
.sq.light .coord{color:var(--dark)} .sq.dark .coord{color:var(--light)}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:20;background:rgba(10,12,18,.45);
  border-radius:10px;backdrop-filter:blur(1.5px)}
.card{background:var(--panel);border:1px solid rgba(255,255,255,.08);padding:20px 24px;border-radius:14px;text-align:center;box-shadow:0 20px 40px rgba(0,0,0,.5);max-width:92%}
.card h2{margin:0 0 4px;font-size:22px} .card p{margin:0 0 14px;color:var(--muted);white-space:pre-wrap}
.card .badge{display:inline-block;margin-bottom:6px}
.badge{font:700 13px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.5px;padding:5px 8px;border-radius:6px;background:#3a3223;color:#ffe1a0;border:1px solid rgba(255,225,160,.35)}
.promo{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:30;background:rgba(10,12,18,.55);border-radius:10px}
.promo .choices{display:flex;gap:8px;background:var(--panel);padding:10px;border-radius:14px;box-shadow:0 20px 40px rgba(0,0,0,.5)}
.promo button{width:calc(var(--sz)/6);height:calc(var(--sz)/6);min-width:44px;min-height:44px;border-radius:10px;border:0;background:var(--light);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.promo button:hover{background:#ffe9c2}
.promo button svg.pc{width:80%;height:80%}
aside.panel{flex:1 1 300px;max-width:400px;min-width:0;background:linear-gradient(180deg,var(--panel),#1e2331);border:1px solid rgba(255,255,255,.06);
  border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;box-shadow:0 12px 30px rgba(0,0,0,.35)}
.status{padding:10px 12px;border-radius:10px;background:var(--panel2);font-weight:600;font-size:16px;display:flex;align-items:center;gap:10px;min-height:48px}
.status .turn{width:16px;height:16px;border-radius:50%;border:2px solid #777;flex:none}
.status .turn.w{background:#fafafa} .status .turn.b{background:#111}
.status.over{background:linear-gradient(90deg,#5b4420,#3a3223);color:#ffe1a0}
.status.check{background:linear-gradient(90deg,#5a2323,#3a2626)}
.status.review{background:linear-gradient(90deg,#27405e,#262f3f)}
.spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.2);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
details.settings{background:rgba(255,255,255,.03);border-radius:10px}
details.settings summary{min-height:44px;display:flex;align-items:center;padding:0 12px;cursor:pointer;color:var(--muted);font-size:13px;list-style:none}
details.settings summary::-webkit-details-marker{display:none}
details.settings summary::after{content:"\25BE";margin-left:auto;padding-left:8px}
details.settings[open] summary::after{content:"\25B4"}
.row{display:grid;gap:8px}
.row.fields{grid-template-columns:1fr 1fr;padding:0 10px 10px}
.row.btns{grid-template-columns:repeat(3,minmax(0,1fr))}
label.field{display:flex;flex-direction:column;gap:4px;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);min-width:0}
select,button.btn{font:inherit;font-size:14px;color:var(--text);background:#343b52;border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:8px;min-height:44px;touch-action:manipulation}
select{width:100%;min-width:0}
select:disabled{opacity:.4}
button.btn{cursor:pointer;font-weight:600;transition:background .15s,transform .05s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;padding:8px 6px}
button.btn:hover{background:#414a66} button.btn:active{transform:translateY(1px)}
button.btn.primary{background:linear-gradient(180deg,#e7bd66,#c9973e);color:#1f1606;border:0}
button.btn.primary:hover{background:linear-gradient(180deg,#f0c877,#d4a24a)}
button.btn:disabled{opacity:.45;cursor:not-allowed}
button.btn[aria-pressed="false"]{color:var(--muted)}
button.btn.sm{min-width:44px;min-height:44px;padding:4px 0;font-size:20px;line-height:1}
.movehead{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.6px}
.movehead .nav{display:flex;gap:6px}
.moves{position:relative;background:#1a1e2a;border-radius:10px;padding:6px;overflow-y:auto;max-height:calc(var(--sz) - 340px);min-height:120px;-webkit-overflow-scrolling:touch}
.moves table{width:100%;border-collapse:collapse;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.moves td{padding:6px 8px}
.moves td.n{color:var(--muted);width:38px;text-align:right}
.moves td.mv{border-radius:5px;cursor:pointer}
.moves td.mv:hover{background:#2a3146}
.moves td.cur{background:#3c4560;color:#fff}
.moves .empty{color:var(--muted);font:13px system-ui,sans-serif;padding:10px}
.hint{color:var(--muted);font-size:12px;text-align:center}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:100;background:#11141c;color:var(--text);border:1px solid rgba(255,255,255,.15);padding:10px 16px;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:92vw;text-align:center;font-size:14px}
.dlg{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;background:rgba(5,7,12,.6);padding:16px}
.dlg .card{min-width:min(320px,100%)}
.dlg .card button.btn{min-width:110px}
@media (max-width:760px){
  :root{--sz:min(96vw, calc(100vh - 160px))}
  @supports (height:100dvh){:root{--sz:min(96vw, calc(100dvh - 160px))}}
  .app{padding:8px 6px 16px} header{margin-bottom:6px} header h1{font-size:18px} header .sub{display:none}
  aside.panel{max-width:none;width:var(--sz);flex:none}
  .moves{max-height:190px}
}
@media (orientation:landscape) and (max-height:540px){
  :root{--sz:min(calc(100vh - 78px), 56vw)}
  @supports (height:100dvh){:root{--sz:min(calc(100dvh - 78px), 56vw)}}
  header{display:none}
  .app{padding:4px 8px;max-width:none}
  main{flex-wrap:nowrap;gap:12px;align-items:flex-start;justify-content:flex-start}
  .board-col{flex:none}
  aside.panel{flex:1 1 0;width:auto;max-width:none;min-width:0;max-height:calc(100vh - 8px);overflow-y:auto}
  @supports (height:100dvh){aside.panel{max-height:calc(100dvh - 8px)}}
  .moves{max-height:130px;min-height:70px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}</style>
</head>
<body>
<div class="app">
  <header><h1><span>&#9822;</span> Chess</h1><div class="sub">Play the computer or a friend &middot; tap or drag to move</div></header>
  <main>
    <section class="board-col">
      <div class="pbar" id="barTop"><div class="captured" id="capTop"></div><div class="clk" id="clkTop"></div></div>
      <div class="frame" id="frame">
        <div class="board" id="board" role="group" aria-label="Chess board"></div>
        <div class="promo hidden" id="promo"><div class="choices" id="promoChoices"></div></div>
        <div class="overlay hidden" id="overlay"><div class="card"><div class="badge" id="ovBadge"></div><h2 id="ovTitle"></h2><p id="ovText"></p>
          <button class="btn primary" id="ovNew">New game</button> <button class="btn" id="ovClose">View board</button></div></div>
      </div>
      <div class="pbar" id="barBottom"><div class="captured" id="capBottom"></div><div class="clk" id="clkBottom"></div></div>
    </section>
    <aside class="panel">
      <div class="status" id="status" role="status" aria-live="polite"></div>
      <details class="settings" id="settings">
        <summary id="setSummary">Game settings</summary>
        <div class="row fields">
          <label class="field">Mode<select id="mode"><option value="hvc">vs Computer</option><option value="hvh">Two players</option></select></label>
          <label class="field">You play<select id="color"><option value="w">White</option><option value="b">Black</option></select></label>
          <label class="field">Level<select id="level"><option value="easy">Easy</option><option value="medium" selected>Medium</option><option value="hard">Hard</option></select></label>
          <label class="field">Clock<select id="clock"><option value="0">None</option><option value="5">5 min</option><option value="10">10 min</option></select></label>
        </div>
      </details>
      <div class="row btns">
        <button class="btn primary" id="newBtn">New game</button>
        <button class="btn" id="undoBtn">Undo</button>
        <button class="btn" id="redoBtn">Redo</button>
        <button class="btn" id="hintBtn">Hint</button>
        <button class="btn" id="flipBtn">Flip</button>
        <button class="btn" id="pgnBtn">Copy PGN</button>
        <button class="btn" id="drawBtn">Offer draw</button>
        <button class="btn" id="resignBtn">Resign</button>
        <button class="btn" id="soundBtn" aria-pressed="true">Sound: on</button>
      </div>
      <div class="movehead"><span class="mh-title">Moves</span>
        <span class="nav"><button class="btn sm" id="navFirst" aria-label="First position">&#171;</button><button class="btn sm" id="navPrev" aria-label="Previous move">&#8249;</button><button class="btn sm" id="navNext" aria-label="Next move">&#8250;</button><button class="btn sm" id="navLast" aria-label="Back to the current position">&#187;</button></span></div>
      <div class="moves" id="moves"></div>
      <div class="hint">Tap a move to review it &middot; Draws: stalemate, 50-move rule, threefold repetition, insufficient material, agreement</div>
    </aside>
  </main>
</div>
<div class="toast hidden" id="toast" role="status"></div>
<div class="dlg hidden" id="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgTitle"><div class="card"><h2 id="dlgTitle"></h2><p id="dlgText"></p>
  <button class="btn primary" id="dlgOk">OK</button> <button class="btn" id="dlgCancel">Cancel</button></div></div>
<script id="engine-src">/* ===== Chess engine: rules, move generation, evaluation, search =====
 * Pure JS, no dependencies. Runs in the page, in a Web Worker and in Node.
 * Board: 0x88 mailbox. Pieces: type 1..6 (P N B R Q K) | color (0 white, 8 black).
 */
(function (root) {
'use strict';
var WHITE = 0, BLACK = 8;
var PAWN = 1, KNIGHT = 2, BISHOP = 3, ROOK = 4, QUEEN = 5, KING = 6;
var F_CAP = 1, F_EP = 2, F_CASTLE = 4, F_DOUBLE = 8;
var KN = [33, 31, 18, 14, -33, -31, -18, -14];
var BI = [17, 15, -17, -15];
var RO = [16, -16, 1, -1];
var KI = [17, 15, -17, -15, 16, -16, 1, -1];
var STACK = 8192;
var START = 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1';
var FILES = 'abcdefgh';

/* ---- Zobrist hashing (two 32-bit lanes) ---- */
var seed = 0x2545F491 | 0;
function rnd() { seed ^= seed << 13; seed ^= seed >>> 17; seed ^= seed << 5; return seed | 0; }
var Z1 = new Int32Array(16 * 128), Z2 = new Int32Array(16 * 128);
for (var zi = 0; zi < Z1.length; zi++) { Z1[zi] = rnd(); Z2[zi] = rnd(); }
var ZC1 = new Int32Array(16), ZC2 = new Int32Array(16);
for (zi = 0; zi < 16; zi++) { ZC1[zi] = rnd(); ZC2[zi] = rnd(); }
var ZE1 = new Int32Array(8), ZE2 = new Int32Array(8);
for (zi = 0; zi < 8; zi++) { ZE1[zi] = rnd(); ZE2[zi] = rnd(); }
var ZS1 = rnd(), ZS2 = rnd();

/* Castling rights: 1=K 2=Q 4=k 8=q. Mask applied to from/to squares. */
var CM = new Int32Array(128);
for (zi = 0; zi < 128; zi++) CM[zi] = 15;
CM[4] = 12; CM[0] = 13; CM[7] = 14; CM[0x74] = 3; CM[0x70] = 7; CM[0x77] = 11;

function mv(from, to, promo, flags) { return from | (to << 7) | (promo << 14) | (flags << 18); }
function mFrom(m) { return m & 127; }
function mTo(m) { return (m >> 7) & 127; }
function mPromo(m) { return (m >> 14) & 15; }
function mFlags(m) { return (m >> 18) & 15; }
function sqName(sq) { return FILES[sq & 7] + ((sq >> 4) + 1); }
function parseSq(s) {
  if (!s || s.length !== 2) return -1;
  var f = FILES.indexOf(s[0]), r = parseInt(s[1], 10) - 1;
  if (f < 0 || !(r >= 0 && r < 8)) return -1;
  return r * 16 + f;
}

function Position(fen) {
  this.board = new Int8Array(128);
  this.kings = [0, 0];
  this.turn = WHITE; this.castle = 0; this.ep = -1; this.epH = 0;
  this.half = 0; this.full = 1; this.h1 = 0; this.h2 = 0; this.ply = 0;
  this.sMove = new Int32Array(STACK); this.sCap = new Int8Array(STACK);
  this.sCastle = new Int8Array(STACK); this.sEp = new Int16Array(STACK);
  this.sEpH = new Int8Array(STACK); this.sHalf = new Int32Array(STACK);
  this.sH1 = new Int32Array(STACK); this.sH2 = new Int32Array(STACK);
  this.load(fen || START);
}
var PP = Position.prototype;

PP.load = function (fen) {
  var parts = fen.trim().split(/\s+/);
  var rows = parts[0].split('/');
  if (rows.length !== 8) throw new Error('Bad FEN (need 8 ranks): ' + fen);
  var b = this.board; b.fill(0);
  var map = { p: PAWN, n: KNIGHT, b: BISHOP, r: ROOK, q: QUEEN, k: KING };
  for (var i = 0; i < 8; i++) {
    var r = 7 - i, f = 0;
    for (var j = 0; j < rows[i].length; j++) {
      var ch = rows[i][j];
      if (ch >= '1' && ch <= '8') { f += +ch; continue; }
      var t = map[ch.toLowerCase()];
      if (!t || f > 7) throw new Error('Bad FEN: ' + fen);
      var pc = t | (ch === ch.toLowerCase() ? BLACK : WHITE);
      b[r * 16 + f] = pc;
      if (t === KING) this.kings[pc >> 3] = r * 16 + f;
      f++;
    }
    if (f !== 8) throw new Error('Bad FEN rank: ' + rows[i]);
  }
  this.turn = (parts[1] || 'w') === 'b' ? BLACK : WHITE;
  var c = parts[2] || '-'; this.castle = 0;
  if (c.indexOf('K') >= 0 && b[4] === KING && b[7] === ROOK) this.castle |= 1;
  if (c.indexOf('Q') >= 0 && b[4] === KING && b[0] === ROOK) this.castle |= 2;
  if (c.indexOf('k') >= 0 && b[0x74] === (KING | BLACK) && b[0x77] === (ROOK | BLACK)) this.castle |= 4;
  if (c.indexOf('q') >= 0 && b[0x74] === (KING | BLACK) && b[0x70] === (ROOK | BLACK)) this.castle |= 8;
  this.ep = parts[3] && parts[3] !== '-' ? parseSq(parts[3]) : -1;
  this.half = parseInt(parts[4] || '0', 10) || 0;
  this.full = parseInt(parts[5] || '1', 10) || 1;
  this.ply = 0;
  this.epH = 0;
  if (this.ep >= 0) {
    var ps = this.ep + (this.turn === WHITE ? -16 : 16), cap = PAWN | this.turn;
    if ((!((ps - 1) & 0x88) && b[ps - 1] === cap) || (!((ps + 1) & 0x88) && b[ps + 1] === cap)) this.epH = 1;
  }
  this.computeHash();
};

PP.computeHash = function () {
  var h1 = 0, h2 = 0, b = this.board;
  for (var sq = 0; sq < 128; sq++) {
    if (sq & 0x88) { sq += 7; continue; }
    if (b[sq]) { h1 ^= Z1[b[sq] * 128 + sq]; h2 ^= Z2[b[sq] * 128 + sq]; }
  }
  h1 ^= ZC1[this.castle]; h2 ^= ZC2[this.castle];
  if (this.ep >= 0 && this.epH) { h1 ^= ZE1[this.ep & 7]; h2 ^= ZE2[this.ep & 7]; }
  if (this.turn === BLACK) { h1 ^= ZS1; h2 ^= ZS2; }
  this.h1 = h1; this.h2 = h2;
};

PP.fen = function () {
  var s = '', b = this.board, ch = ' PNBRQK';
  for (var r = 7; r >= 0; r--) {
    var e = 0;
    for (var f = 0; f < 8; f++) {
      var pc = b[r * 16 + f];
      if (!pc) { e++; continue; }
      if (e) { s += e; e = 0; }
      var c = ch[pc & 7]; s += pc & 8 ? c.toLowerCase() : c;
    }
    if (e) s += e;
    if (r) s += '/';
  }
  var cs = (this.castle & 1 ? 'K' : '') + (this.castle & 2 ? 'Q' : '') + (this.castle & 4 ? 'k' : '') + (this.castle & 8 ? 'q' : '');
  return s + ' ' + (this.turn ? 'b' : 'w') + ' ' + (cs || '-') + ' ' + (this.ep >= 0 ? sqName(this.ep) : '-') + ' ' + this.half + ' ' + this.full;
};

/* Is square `sq` attacked by color `by` (0 or 8)? */
PP.attacked = function (sq, by) {
  var b = this.board, s, i, p;

    if (!clocks) { clocks = []; for (var j = 0; j <= sn.length; j++) clocks.push({ w: full, b: full }); }
    rem = s.rem && typeof s.rem.w === 'number' ? { w: s.rem.w, b: s.rem.b } : { w: full, b: full };
    tickAt = Date.now(); viewPly = -1; viewPos = null; selected = -1; hintMove = 0;
    return true;
  } catch (e) { return false; }
}

/* ---------- controls ---------- */
function confirmNew(msg) {
  if (!gameInProgress()) { newGame(); return; }
  ask('Start a new game?', msg || 'The game in progress will be lost.', 'New game', function (yes) { if (yes) newGame(); else writeSelects(); });
}
$('newBtn').onclick = function () { confirmNew(); };
$('ovNew').onclick = function () { newGame(); };
$('ovClose').onclick = function () { overDismissed = true; renderOverlay(); };
$('undoBtn').onclick = undo;
$('redoBtn').onclick = redoMove;
$('hintBtn').onclick = hint;
$('drawBtn').onclick = offerDraw;
$('resignBtn').onclick = resign;
$('pgnBtn').onclick = copyPgn;
$('flipBtn').onclick = function () { flipped = !flipped; buildBoard(); render(); save(); };
$('soundBtn').onclick = function () { prefs.sound = !prefs.sound; savePrefs(); unlockAudio(); renderButtons(); if (prefs.sound) setTimeout(function () { sfx('move'); }, 60); };
$('navFirst').onclick = function () { setView(0); };
$('navPrev').onclick = function () { navStep(-1); };
$('navNext').onclick = function () { navStep(1); };
$('navLast').onclick = function () { setView(-1); };
['mode', 'color', 'clock'].forEach(function (id) {
  $(id).onchange = function () { confirmNew('Changing this setting starts a new game. The game in progress will be lost.'); };
});
$('level').onchange = function () { cfg.level = $('level').value; renderButtons(); save(); };

/* test/debug hook */
window.chessApp = {
  get pos() { return pos; }, get sans() { return sans.slice(); }, get over() { return over; }, get ended() { return ended; },
  get thinking() { return thinking; }, get usingWorker() { return !!worker; }, get cfg() { return cfg; }, get rem() { return liveRem(); },
  get redoCount() { return redo.length; }, get viewPly() { return viewPly; }, get hint() { return hintMove ? E.moveToUci(hintMove) : null; },
  newGame: newGame, undo: undo, redo: redoMove,
  setClock: function (w, b) { settleClock(); rem = { w: w, b: b }; tickAt = Date.now(); renderClocks(); },
  playUci: function (u) { var m = pos.uciToMove(u); if (m && legal.indexOf(m) >= 0) { cancelAI(); play(m, { noSlide: true }); return true; } return false; }
};

/* ---------- start ---------- */
try { var pr = JSON.parse(localStorage.getItem(PREF_KEY) || 'null'); if (pr && typeof pr.sound === 'boolean') prefs.sound = pr.sound; } catch (e) {}
$('settings').open = window.innerWidth > 760 && window.innerHeight > 540;
if (loadSave()) {
  writeSelects(); buildBoard();
  afterChange();
  toast(over ? 'Previous game restored.' : 'Game resumed.');
} else newGame();
})();</script>
